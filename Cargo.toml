[package]
name = "shapels"
version = "0.4.1"
edition = "2024"
description = "Shape inference for torch on your editor"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/carrascomj/shapels"

[dependencies]
lsp-types = "0.95"
rustpython-parser = "0.3"
thiserror = "1.0"
lsp-server = "0.7"
serde_json = "1.0"
phf = { version = "0.13.1"}
phf_macros = "0.13.1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[lib]
name = "shapels"
path = "src/lib.rs"
bench = false

[[bin]]
name = "shapels"
path = "src/main.rs"
bench = false

[[bench]]
name = "bench_selected_tests"
harness = false

[[bench]]
name = "bench_macro_lsp"
harness = false
